name: Build GPT Manager APK

on:
  workflow_dispatch:
  push:
    branches: [gpt-manager-apk-build-20260913]
    paths:
      - 'gpt-manager-android/**'
      - '.github/workflows/build-gpt-manager-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply WebView security patch
        working-directory: gpt-manager-android
        run: python3 secure_patch.py
      - name: Apply v1.1 stability/UI patch
        working-directory: gpt-manager-android
        run: python3 v11_patch.py
      - name: Static feature checks
        working-directory: gpt-manager-android
        run: |
          grep -q 'case "recentTokens"' app/src/main/java/com/gptyar/manager/MainActivity.java
          grep -q 'recent_tokens_v1' app/src/main/java/com/gptyar/manager/MainActivity.java
          grep -q 'trimmed.startsWith("\[")' app/src/main/java/com/gptyar/manager/MainActivity.java
          grep -q 'subscriptionLoadOk' app/src/main/java/com/gptyar/manager/MainActivity.java
          grep -q 'webView.removeJavascriptInterface("AndroidApi")' app/src/main/java/com/gptyar/manager/MainActivity.java
          grep -q 'توکن‌های اخیر' app/src/main/assets/index.html
          grep -q "versionName '1.1.0'" app/build.gradle
          grep -q 'android:icon="@drawable/ic_launcher"' app/src/main/AndroidManifest.xml
      - name: Build debug APK
        working-directory: gpt-manager-android
        run: gradle --no-daemon clean assembleDebug
      - name: Verify APK
        run: |
          APK=gpt-manager-android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'assets/index.html'
          unzip -l "$APK" | grep -q 'classes.dex'
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee APK_SIGNATURE.txt
          "$AAPT" dump badging "$APK" | tee APK_BADGING.txt
          grep -q "package: name='com.gptyar.manager'" APK_BADGING.txt
          grep -q "versionName='1.1.0'" APK_BADGING.txt
          grep -q "application-label:'GPT Manager'" APK_BADGING.txt
          sha256sum "$APK" | tee APK_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GPT-Manager-Android-v1.1.0
          path: |
            gpt-manager-android/app/build/outputs/apk/debug/app-debug.apk
            APK_SHA256.txt
            APK_SIGNATURE.txt
            APK_BADGING.txt
          if-no-files-found: error
