name: Build GPT Manager APK

on:
  workflow_dispatch:
  push:
    branches: [gpt-manager-apk-build-20260913]
    paths:
      - 'gpt-manager-android/**'
      - '.github/workflows/build-gpt-manager-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply WebView security patch
        working-directory: gpt-manager-android
        run: python3 secure_patch.py
      - name: Apply v1.1 base patch
        working-directory: gpt-manager-android
        run: python3 v11_patch.py
      - name: Apply v1.2 proxy/UI patch
        working-directory: gpt-manager-android
        run: python3 v12_patch.py
      - name: Apply v1.3 lifecycle/state patch
        working-directory: gpt-manager-android
        run: python3 v13_patch.py
      - name: Apply v1.4 final fixes
        working-directory: gpt-manager-android
        run: python3 v14_patch.py
      - name: Static and UI regression checks
        working-directory: gpt-manager-android
        run: |
          JAVA=app/src/main/java/com/gptyar/manager/MainActivity.java
          HTML=app/src/main/assets/index.html
          grep -q 'createPopupWebView(Message resultMsg)' "$JAVA"
          grep -q 'closePopupWebView(WebView child)' "$JAVA"
          grep -q 'popupViews' "$JAVA"
          grep -q 'moveTaskToBack(true)' "$JAVA"
          grep -q 'return ok().put("recentTokens", recentTokens())' "$JAVA"
          grep -q '.put("active", activeState())' "$JAVA"
          grep -q 'saveActiveState(subscriptionId, ref.type, target)' "$JAVA"
          grep -q '.put("proxyId", proxyId)' "$JAVA"
          grep -q 'api("/clients/proxy/ping", "POST", token, pingBody, null, true)' "$JAVA"
          grep -q 'api("/cookie/fetch", "POST", token, cb, null, true)' "$JAVA"
          ! grep -q 'api("/clients/proxy/ping", "POST", token, pingBody, spec, true)' "$JAVA"
          ! grep -q 'api("/cookie/fetch", "POST", token, cb, spec, true)' "$JAVA"
          grep -q 'function renderRecent(data=null)' "$HTML"
          grep -q 'غیرفعال‌سازی' "$HTML"
          grep -q 'فعال‌سازی و ورود' "$HTML"
          grep -q 'مدیریت اعلان‌ها' "$HTML"
          grep -q 'انتخاب تاریخ انقضا' "$HTML"
          grep -q "versionName '1.4.0'" app/build.gradle
          grep -q 'android:icon="@drawable/ic_launcher"' app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>([\s\S]*?)</script>',h)
          assert m,'embedded JS missing'
          Path('/tmp/gpt-manager-v14.js').write_text(m.group(1),encoding='utf-8')
          print('embedded JS extracted')
          PY
          node --check /tmp/gpt-manager-v14.js
          node v14_ui_test.js
      - name: Build debug APK
        working-directory: gpt-manager-android
        run: gradle --no-daemon clean assembleDebug
      - name: Verify APK
        run: |
          APK=gpt-manager-android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'assets/index.html'
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -l "$APK" | grep -q 'res/drawable/ic_launcher.xml'
          unzip -p "$APK" assets/index.html | grep -q 'v1.4.0'
          unzip -p "$APK" assets/index.html | grep -q 'غیرفعال‌سازی'
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee APK_SIGNATURE.txt
          "$AAPT" dump badging "$APK" | tee APK_BADGING.txt
          grep -q "package: name='com.gptyar.manager'" APK_BADGING.txt
          grep -q "versionName='1.4.0'" APK_BADGING.txt
          grep -q "application-label:'GPT Manager'" APK_BADGING.txt
          sha256sum "$APK" | tee APK_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GPT-Manager-Android-v1.4.0-FINAL
          path: |
            gpt-manager-android/app/build/outputs/apk/debug/app-debug.apk
            APK_SHA256.txt
            APK_SIGNATURE.txt
            APK_BADGING.txt
          if-no-files-found: error
