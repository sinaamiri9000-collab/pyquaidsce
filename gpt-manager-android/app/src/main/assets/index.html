<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GPT Manager</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');
:root{--bg:#071426;--panel:#0d2036;--panel2:#102842;--line:#1d3a58;--text:#f2f7fc;--muted:#91a9bd;--blue:#4d7cff;--green:#19b884;--red:#ef5b67;--shadow:0 18px 50px rgba(0,0,0,.27)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#112849 0,#071426 34%,#06111f 100%);color:var(--text);font-family:Vazirmatn,Tahoma,sans-serif;min-height:100vh}button,input{font:inherit}.wrap{max-width:980px;margin:auto;padding:18px 14px 42px}.hero{padding:18px 4px 22px}.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,#4f7cff,#7d5cff);display:grid;place-items:center;font-weight:800;box-shadow:0 12px 28px #3159c655}.brand h1{font-size:23px;margin:0}.sub{color:var(--muted);font-size:13px;margin-top:4px}.status{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.pill{padding:7px 11px;border:1px solid var(--line);border-radius:999px;background:#0b1c30;color:#a9bfd2;font-size:12px}.pill.ok{border-color:#1f6f5c;color:#59d9ae}.card{background:linear-gradient(180deg,#0e2239ee,#0a1c30ee);border:1px solid #173651;border-radius:22px;box-shadow:var(--shadow);padding:18px;margin-bottom:14px}.login{max-width:520px;margin:8vh auto 0}.title{font-weight:800;font-size:21px;margin:0 0 8px}.desc{color:var(--muted);font-size:13px;line-height:1.9}.field{margin-top:16px}.field label{display:block;font-size:13px;color:#b8cad8;margin-bottom:7px}.field input{width:100%;border:1px solid #21425f;border-radius:14px;background:#091a2d;color:#fff;padding:13px;outline:none}.field input:focus{border-color:#4f7cff;box-shadow:0 0 0 3px #4f7cff22}.btn{border:0;border-radius:14px;padding:12px 15px;color:#fff;background:#15314f;cursor:pointer;font-weight:700}.btn.primary{background:linear-gradient(135deg,#3478ef,#6d67f4)}.btn.green{background:linear-gradient(135deg,#109b70,#19bd8b)}.btn.red{background:#742f3b}.btn.ghost{background:#0b1d31;border:1px solid #244560}.btn.small{padding:8px 11px;border-radius:11px;font-size:12px}.btn:disabled{opacity:.5}.full{width:100%;margin-top:14px}.topbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.profile{display:flex;gap:10px;align-items:center}.avatar{width:42px;height:42px;border-radius:14px;background:#142e4c;display:grid;place-items:center}.name{font-weight:800}.muted{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:14px;border:1px solid #193854;border-radius:17px;background:#0a1d31}.stat b{display:block;font-size:22px}.sectionHead{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:18px 0 10px}.sectionHead h2{margin:0;font-size:18px}.services{display:grid;gap:12px}.service{border:1px solid #193a57;border-radius:18px;background:#091c30;padding:15px}.serviceHead{display:flex;justify-content:space-between;align-items:center}.serviceName{font-size:19px;font-weight:800}.badge{padding:5px 9px;border-radius:999px;border:1px solid #2b4e69;color:#a5bdd0;font-size:11px}.subscription{margin-top:11px;padding:13px;border-radius:15px;background:#0f2942;border:1px solid #1e4665}.subTop{display:flex;justify-content:space-between;gap:10px}.subName{font-weight:700}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.notice{padding:12px;border-radius:15px;background:#112a43;border:1px solid #1b4663;margin-top:9px}.notice b{display:block;margin-bottom:4px}.notice p{margin:0;color:#a9bdcb;line-height:1.8;font-size:13px}.search{width:100%;border:1px solid #204360;border-radius:14px;padding:12px;background:#081a2d;color:#fff}.userRow{padding:14px;border:1px solid #193d59;border-radius:17px;background:#091c30;margin-top:10px}.userHead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.tokenbox{direction:ltr;text-align:left;background:#061522;border:1px dashed #2a506b;border-radius:12px;padding:9px 10px;font-family:monospace;font-size:12px;color:#bce6d7;overflow:auto;margin-top:9px}.diag{margin-top:12px;background:#061621;border-radius:14px;padding:10px;border:1px solid #183a4c}.diagline{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:12px}.good{color:#43d9a8}.bad{color:#ff7b85}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;z-index:20}.modal.show{display:flex}.sheet{width:100%;max-height:80vh;overflow:auto;background:#0b1f34;border-radius:25px 25px 0 0;padding:18px;border-top:1px solid #2a4a66}.choice{width:100%;text-align:right;margin-top:8px}.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#111f2e;border:1px solid #35516a;padding:11px 15px;border-radius:13px;display:none;z-index:40;max-width:88%;box-shadow:var(--shadow)}.toast.show{display:block}.loading{opacity:.65;pointer-events:none}.hidden{display:none!important}@media(max-width:620px){.grid{grid-template-columns:1fr 1fr}.card{padding:14px}.wrap{padding:12px 10px 30px}.hero{padding-top:8px}}
</style>
</head>
<body><div class="wrap">
<div class="hero"><div class="brand"><div class="logo">G</div><div><h1>GPT Manager</h1><div class="sub">نسخه اندروید مستقل • بدون نیاز به Kiwi Extension</div></div></div><div class="status"><span class="pill ok">API • api.gptyar.com</span><span class="pill" id="devPill">Device</span></div></div>
<div id="loginView" class="card login"><div class="title">ورود با توکن</div><div class="desc">کاربر و مدیر هر دو فقط با توکن وارد می‌شوند. نقش حساب از خود API تشخیص داده می‌شود.</div><form id="loginForm" autocomplete="off"><div class="field"><label>توکن</label><input id="tokenInput" type="password" autocomplete="new-password" spellcheck="false" placeholder="توکن را وارد کنید"></div><button class="btn primary full" id="loginBtn">ورود</button></form></div>
<div id="appView" class="hidden"><div class="card topbar"><div class="profile"><div class="avatar">👤</div><div><div class="name" id="profileName">حساب</div><div class="muted" id="profileRole"></div></div></div><button class="btn ghost small" onclick="logout()">خروج</button></div><div id="content"></div></div>
</div>
<div class="modal" id="modal"><div class="sheet"><div class="sectionHead"><h2 id="modalTitle">انتخاب</h2><button class="btn ghost small" onclick="closeModal()">بستن</button></div><div id="modalBody"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s); const content=$('#content'); let state={role:null,data:null};
function call(action,p={}){try{return JSON.parse(AndroidApi.request(action,JSON.stringify(p)))}catch(e){return{ok:false,error:String(e)}}}
function faDigits(v){return String(v??'').replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d])}
function pdate(v,withTime=false){if(!v)return '—';let d=new Date(v);if(isNaN(d))return faDigits(v);let o={calendar:'persian',year:'numeric',month:'2-digit',day:'2-digit'};if(withTime){o.hour='2-digit';o.minute='2-digit';o.hour12=false}return new Intl.DateTimeFormat('fa-IR-u-ca-persian',o).format(d).replace(/،/g,'')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(t,bad=false){const x=$('#toast');x.textContent=t;x.style.borderColor=bad?'#743a44':'#35516a';x.classList.add('show');setTimeout(()=>x.classList.remove('show'),3200)}
function busy(el,on){if(!el)return;el.disabled=on;el.closest('.card,.service,.userRow')?.classList.toggle('loading',on)}
function closeModal(){$('#modal').classList.remove('show')} function openModal(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modal').classList.add('show')}
function diagHtml(d){if(!d?.steps)return'';return `<div class="diag">${d.steps.map(x=>`<div class="diagline ${x.ok?'good':'bad'}"><span>${x.ok?'✓':'✕'}</span><span>${esc(x.detail||x.stage)}</span></div>`).join('')}</div>`}
function subscriptions(agent){return agent.userSubscriptions||agent.subscriptions||agent.user_subscriptions||[]}
function agentType(a){return String(a.type||a.agentType||a.key||a.name||'SERVICE').toUpperCase()}
function subId(s){return Number(s.id||s.subscriptionId||0)}
function acct(s){return s.account?.name||s.name||`اشتراک ${faDigits(subId(s))}`}
function showLogged(r,token){state={role:r.role,data:r,token};$('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');$('#profileRole').textContent=r.role==='admin'?'مدیر':'کاربر';$('#profileName').textContent=r.role==='admin'?(r.profile?.account?.name||'مدیر'):(r.user?.name||r.user?.account?.name||'کاربر'); if(r.role==='admin')renderAdmin(r.subscribers||[]);else renderUser(r)}
$('#devPill').textContent='Device • '+faDigits((AndroidApi.getDeviceId()||'').slice(0,8));
$('#loginForm').addEventListener('submit',e=>{e.preventDefault();const b=$('#loginBtn'),token=$('#tokenInput').value.trim();busy(b,true);setTimeout(()=>{const r=call('login',{token});busy(b,false);if(!r.ok)return toast(r.error||'ورود ناموفق بود',true);showLogged(r,token)},30)});
function logout(){call('logout');state={};$('#appView').classList.add('hidden');$('#loginView').classList.remove('hidden');$('#tokenInput').value='';content.innerHTML=''}
function renderUser(r){const agents=r.agents||[];const notes=r.notifications||[];const count=agents.reduce((n,a)=>n+subscriptions(a).length,0);content.innerHTML=`<div class="grid"><div class="stat"><span class="muted">اشتراک‌ها</span><b>${faDigits(count)}</b></div><div class="stat"><span class="muted">سرویس‌ها</span><b>${faDigits(agents.length)}</b></div><div class="stat"><span class="muted">Device</span><b style="font-size:13px">${esc((r.deviceId||'').slice(0,8))}</b></div></div>${notes.length?`<div class="card"><div class="sectionHead"><h2>اعلان‌ها</h2></div>${notes.map(n=>`<div class="notice"><b>${esc(n.title||'اعلان')}</b><p>${esc(n.message||n.text||'')}</p></div>`).join('')}</div>`:''}<div class="card"><div class="sectionHead"><h2>سرویس‌ها و اشتراک‌ها</h2><span class="badge">Session activation</span></div><div class="services">${agents.map(serviceHtml).join('')}</div></div>`}
function serviceHtml(a){const type=agentType(a),subs=subscriptions(a);return `<div class="service"><div class="serviceHead"><div class="serviceName">${esc(a.title||type)}</div><span class="badge">${esc(type)}</span></div>${subs.length?subs.map(s=>`<div class="subscription" id="sub-${subId(s)}"><div class="subTop"><div><div class="subName">${esc(acct(s))}</div><div class="muted">شناسه: ${faDigits(subId(s))} • انقضا: ${pdate(s.expiresAt||s.expirationDate)}</div></div></div><div class="actions"><button class="btn primary small" onclick="activate(${subId(s)},this)">فعال‌سازی و ورود</button></div><div class="diag hidden" data-diag></div></div>`).join(''):`<div class="muted" style="margin-top:10px">اشتراکی برای این سرویس ثبت نشده است.</div>`}</div>`}
function activate(id,btn){busy(btn,true);setTimeout(()=>{const r=call('activate',{subscriptionId:id});busy(btn,false);const box=document.querySelector(`#sub-${id} [data-diag]`);if(box&&r.diagnostic){box.classList.remove('hidden');box.innerHTML=diagHtml(r.diagnostic)}if(!r.ok)return toast(r.error||'فعال‌سازی ناموفق بود',true);toast('حساب فعال شد و سرویس باز می‌شود')},30)}
function renderAdmin(rows){content.innerHTML=`<div class="card"><div class="sectionHead"><h2>مدیریت کاربران</h2><button class="btn green small" onclick="createUser()">کاربر جدید</button></div><input class="search" id="search" placeholder="جستجو بر اساس نام یا شناسه" oninput="filterUsers()"><div id="users">${rows.map(userHtml).join('')}</div></div>`}
function userHtml(u){return `<div class="userRow" data-user data-id="${u.subscriptionId}" data-search="${esc((u.name||'')+' '+(u.subscriptionId||''))}"><div class="userHead"><div><div class="subName">${esc(u.name||'کاربر')}</div><div class="muted">شناسه: ${faDigits(u.subscriptionId)} • انقضا: ${pdate(u.expiresAt)}</div></div><span class="badge">${esc(u.agentType||'USER')}</span></div><div class="tokenbox hidden" data-token>••••••••••••</div><div class="actions"><button class="btn ghost small" onclick="showToken(${u.subscriptionId},this)">نمایش توکن</button><button class="btn ghost small" onclick="copyToken(${u.subscriptionId},this)">کپی توکن</button><button class="btn primary small" onclick="adminActivate(${u.subscriptionId},this)">فعال‌سازی و ورود</button><button class="btn ghost small" onclick="editExpiry(${u.subscriptionId})">تغییر انقضا</button><button class="btn red small" onclick="deleteUser(${u.subscriptionId})">حذف</button></div><div data-admin-diag></div></div>`}
function filterUsers(){const q=$('#search').value.trim().toLowerCase();document.querySelectorAll('[data-user]').forEach(x=>x.style.display=x.dataset.search.toLowerCase().includes(q)?'':'none')}
function getToken(id){return call('subscriberToken',{subscriberId:id})}
function showToken(id,btn){busy(btn,true);setTimeout(()=>{const r=getToken(id);busy(btn,false);if(!r.ok)return toast(r.error,true);const row=btn.closest('.userRow'),box=row.querySelector('[data-token]');box.textContent=r.token;box.classList.remove('hidden');setTimeout(()=>{box.textContent='••••••••••••';box.classList.add('hidden')},30000)},30)}
function copyToken(id,btn){busy(btn,true);setTimeout(()=>{const r=getToken(id);busy(btn,false);if(!r.ok)return toast(r.error,true);AndroidApi.copy(r.token);toast('توکن کپی شد')},30)}
function adminActivate(id,btn,target=-1){busy(btn,true);setTimeout(()=>{const r=call('adminActivate',{subscriberId:id,targetSubscriptionId:target});busy(btn,false);if(r.requiresSelection){openModal('انتخاب اشتراک',(r.candidates||[]).map(c=>`<button class="btn ghost choice" onclick="chooseAdminSub(${id},${c.subscriptionId})"><b>${esc(c.accountName||c.agentType)}</b><br><span class="muted">${esc(c.agentType)} • ${pdate(c.expiresAt)}</span></button>`).join(''));return}const row=document.querySelector(`[data-user][data-id="${id}"]`);if(row){const d=row.querySelector('[data-admin-diag]');d.innerHTML=diagHtml(r.diagnostic)}if(!r.ok)return toast(r.error||'فعال‌سازی ناموفق بود',true);toast('حساب کاربر فعال شد')},30)}
function chooseAdminSub(id,sid){closeModal();const btn=document.querySelector(`[data-user][data-id="${id}"] .btn.primary`);adminActivate(id,btn,sid)}
function createUser(){openModal('ایجاد کاربر',`<div class="field"><label>نام</label><input id="newName"></div><div class="field"><label>انقضا (میلادی ISO یا YYYY-MM-DD)</label><input id="newExp" placeholder="2027-01-01"></div><button class="btn green full" onclick="doCreate()">ایجاد</button>`)}
function doCreate(){const r=call('adminCreate',{name:$('#newName').value.trim(),expiresAt:$('#newExp').value.trim()});if(!r.ok)return toast(r.error,true);closeModal();refreshAdmin();toast('ایجاد شد')}
function editExpiry(id){openModal('تغییر تاریخ انقضا',`<div class="field"><label>تاریخ جدید</label><input id="expEdit" placeholder="2027-01-01T12:00:00Z"></div><button class="btn primary full" onclick="doEdit(${id})">ذخیره</button>`)}
function doEdit(id){const r=call('adminUpdate',{subscriptionId:id,expiresAt:$('#expEdit').value.trim()});if(!r.ok)return toast(r.error,true);closeModal();refreshAdmin();toast('به‌روزرسانی شد')}
function deleteUser(id){if(!confirm('این اشتراک حذف شود؟'))return;const r=call('adminDelete',{subscriptionId:id});if(!r.ok)return toast(r.error,true);refreshAdmin();toast('حذف شد')}
function refreshAdmin(){const r=call('adminSubscribers');if(r.ok)renderAdmin(r.data||[]);else toast(r.error,true)}
</script></body></html>
