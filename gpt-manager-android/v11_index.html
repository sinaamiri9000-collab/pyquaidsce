<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GPT Manager</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');
:root{--bg:#06131f;--panel:#0b1d2d;--panel2:#10273a;--line:#1b3a50;--text:#f5f9fc;--muted:#94aabd;--green:#16c58d;--cyan:#4bdcf2;--blue:#4e7cff;--red:#ef626d;--shadow:0 18px 48px rgba(0,0,0,.28)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 72% -10%,#123b55 0,#071724 38%,#050e17 100%);color:var(--text);font-family:Vazirmatn,Tahoma,sans-serif}button,input{font:inherit}.wrap{max-width:920px;margin:auto;padding:18px 13px 42px}.hero{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 3px 18px}.brand{display:flex;align-items:center;gap:11px}.logo{width:50px;height:50px;border-radius:17px;background:linear-gradient(145deg,#0f3652,#071a2d);border:1px solid #25516c;position:relative;box-shadow:0 12px 30px #0006}.logo:before,.logo:after{content:"";position:absolute;border:5px solid;border-radius:16px;width:24px;height:24px;transform:rotate(45deg)}.logo:before{border-color:#52e4ff;left:7px;top:8px}.logo:after{border-color:#13d89b;right:7px;bottom:8px}.brand h1{font-size:22px;margin:0}.subtitle{color:var(--muted);font-size:12px;margin-top:3px}.ver{border:1px solid #24475f;background:#0a1d2d;border-radius:999px;padding:6px 9px;color:#a9bfd0;font-size:11px}.card{background:linear-gradient(180deg,#0d2234f5,#091927f5);border:1px solid #17364b;border-radius:22px;box-shadow:var(--shadow);padding:17px;margin-bottom:13px}.login{max-width:540px;margin:4vh auto 0}.title{font-weight:800;font-size:21px;margin-bottom:6px}.desc{color:var(--muted);font-size:13px;line-height:1.85}.field{margin-top:15px}.field input,.search{width:100%;border:1px solid #20445c;border-radius:14px;background:#071725;color:#fff;padding:13px;outline:none}.field input:focus,.search:focus{border-color:#21a9b9;box-shadow:0 0 0 3px #21a9b922}.btn{border:0;border-radius:14px;padding:11px 14px;color:#fff;background:#17334a;font-weight:700;cursor:pointer}.btn.primary{background:linear-gradient(135deg,#14b985,#2b8de8)}.btn.green{background:linear-gradient(135deg,#0ea775,#16c58d)}.btn.red{background:#71303a}.btn.ghost{background:#0a1c2b;border:1px solid #24475c}.btn.small{padding:8px 10px;border-radius:11px;font-size:12px}.btn:disabled{opacity:.55}.full{width:100%;margin-top:12px}.recentWrap{margin-top:17px;border-top:1px solid #17354a;padding-top:13px}.recentHead,.sectionHead,.topbar,.serviceHead,.subTop,.userHead{display:flex;align-items:center;justify-content:space-between;gap:10px}.recentHead h3,.sectionHead h2{margin:0;font-size:16px}.recentList{display:grid;gap:8px;margin-top:9px}.recent{display:flex;align-items:center;gap:9px;padding:10px;border:1px solid #18394f;background:#091b2a;border-radius:14px}.recentMain{flex:1;min-width:0;cursor:pointer}.recentLabel{font-weight:700;font-size:13px}.recentToken{direction:ltr;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#90aec1;font-family:monospace;font-size:11px;margin-top:2px}.recentTime{font-size:10px;color:#6f8798;margin-top:2px}.iconBtn{width:34px;height:34px;border-radius:11px;border:1px solid #28485d;background:#0b2030;color:#a9bfd0}.hidden{display:none!important}.topbar{margin-bottom:13px}.profile{display:flex;align-items:center;gap:9px}.avatar{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#123852,#0d2234);display:grid;place-items:center;font-size:19px}.name{font-weight:800}.muted{color:var(--muted);font-size:12px}.toolbarActions{display:flex;gap:7px}.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat{border:1px solid #18394f;background:#091b2a;border-radius:16px;padding:13px}.stat b{display:block;font-size:22px;margin-top:2px}.sectionHead{margin-bottom:10px}.services{display:grid;gap:11px}.service{border:1px solid #193b51;border-radius:18px;background:#081a29;padding:14px}.serviceName{font-size:18px;font-weight:800}.badge{border:1px solid #2b5065;border-radius:999px;padding:5px 8px;color:#9bb6c7;font-size:10px}.subscription{margin-top:10px;padding:13px;border-radius:15px;background:#0e2639;border:1px solid #1c455c}.subName{font-weight:700}.subMeta{color:#8fa8b9;font-size:11px;margin-top:4px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.diag{margin-top:10px;border-radius:13px;background:#06141e;border:1px solid #173747;padding:9px}.diagline{display:flex;gap:7px;padding:4px 0;font-size:11px}.good{color:#43d9a8}.bad{color:#ff7b85}.notice{padding:11px;border-radius:14px;background:#10283a;border:1px solid #1d465c;margin-top:8px}.notice b{display:block;font-size:13px}.notice p{margin:4px 0 0;color:#a5bac8;font-size:12px;line-height:1.75}.empty{padding:24px 10px;text-align:center;color:#8ea5b5}.userRow{padding:13px;border:1px solid #193d53;border-radius:16px;background:#081a29;margin-top:9px}.tokenbox{direction:ltr;text-align:left;background:#06141e;border:1px dashed #2a5064;border-radius:11px;padding:8px;font-family:monospace;font-size:11px;color:#bde8d8;overflow:auto;margin-top:8px}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;z-index:30}.modal.show{display:flex}.sheet{width:100%;max-height:80vh;overflow:auto;background:#0a1d2c;border-radius:24px 24px 0 0;padding:17px;border-top:1px solid #285066}.choice{width:100%;text-align:right;margin-top:8px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#102333;border:1px solid #35586c;padding:10px 14px;border-radius:13px;display:none;z-index:50;max-width:90%;box-shadow:var(--shadow)}.toast.show{display:block}.loading{opacity:.55;pointer-events:none}@media(max-width:620px){.wrap{padding:12px 10px 28px}.card{padding:14px}.hero{padding-top:4px}.subtitle{max-width:230px}.summary{grid-template-columns:1fr 1fr}}
</style>
</head>
<body><div class="wrap">
<div class="hero"><div class="brand"><div class="logo"></div><div><h1>GPT Manager</h1><div class="subtitle">ورود سریع و مدیریت اشتراک‌ها</div></div></div><span class="ver">v1.1.0</span></div>
<div id="loginView" class="card login">
  <div class="title">ورود با توکن</div><div class="desc">توکن حساب را وارد کنید. توکن‌های موفق اخیر روی همین دستگاه نگهداری می‌شوند تا ورود بعدی سریع باشد.</div>
  <form id="loginForm" autocomplete="off"><div class="field"><input id="tokenInput" type="password" autocomplete="off" spellcheck="false" placeholder="توکن"></div><button class="btn primary full" id="loginBtn">ورود</button></form>
  <div id="recentWrap" class="recentWrap hidden"><div class="recentHead"><h3>توکن‌های اخیر</h3><button class="btn ghost small" onclick="clearHistory()">پاک کردن همه</button></div><div class="recentList" id="recentList"></div></div>
</div>
<div id="appView" class="hidden"><div class="card topbar"><div class="profile"><div class="avatar">👤</div><div><div class="name" id="profileName">حساب</div><div class="muted" id="profileRole"></div></div></div><div class="toolbarActions"><button class="btn ghost small" id="refreshBtn" onclick="refreshCurrent()">↻ بروزرسانی</button><button class="btn ghost small" onclick="logout()">خروج</button></div></div><div id="content"></div></div>
</div>
<div class="modal" id="modal"><div class="sheet"><div class="sectionHead"><h2 id="modalTitle">انتخاب</h2><button class="btn ghost small" onclick="closeModal()">بستن</button></div><div id="modalBody"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);const content=$('#content');let state={role:null,data:null,token:null};let recentTokens=[];
function call(action,p={}){try{return JSON.parse(AndroidApi.request(action,JSON.stringify(p)))}catch(e){return{ok:false,error:'خطای ارتباط داخلی برنامه'}}}
function fa(v){return String(v??'').replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d])}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function pdate(v,withTime=false){if(!v)return'—';let d=new Date(v);if(isNaN(d))return fa(v);let o={calendar:'persian',year:'numeric',month:'2-digit',day:'2-digit'};if(withTime){o.hour='2-digit';o.minute='2-digit';o.hour12=false}return new Intl.DateTimeFormat('fa-IR-u-ca-persian',o).format(d).replace(/،/g,'')}
function toast(t,bad=false){const x=$('#toast');x.textContent=t;x.style.borderColor=bad?'#733943':'#35586c';x.classList.add('show');setTimeout(()=>x.classList.remove('show'),3200)}
function busy(el,on){if(!el)return;el.disabled=on;el.closest('.card,.service,.userRow')?.classList.toggle('loading',on)}
function closeModal(){$('#modal').classList.remove('show')}function openModal(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modal').classList.add('show')}
function maskToken(t){t=String(t||'');if(t.length<12)return'••••••';return t.slice(0,6)+'••••••'+t.slice(-5)}
function renderRecent(){const r=call('recentTokens');recentTokens=r.ok?(r.data||[]):[];const w=$('#recentWrap'),list=$('#recentList');if(!recentTokens.length){w.classList.add('hidden');list.innerHTML='';return}w.classList.remove('hidden');list.innerHTML=recentTokens.map((x,i)=>`<div class="recent"><div class="recentMain" onclick="loginRecent(${i})"><div class="recentLabel">${esc(x.label||((x.role==='admin')?'مدیر':'کاربر'))}</div><div class="recentToken">${esc(maskToken(x.token))}</div><div class="recentTime">آخرین ورود: ${pdate(Number(x.lastUsed||0),true)}</div></div><button class="iconBtn" onclick="forgetRecent(event,${i})">×</button></div>`).join('')}
function forgetRecent(e,i){e.stopPropagation();const x=recentTokens[i];if(!x)return;call('forgetRecentToken',{token:x.token});renderRecent()}
function clearHistory(){call('clearRecentTokens');renderRecent()}
function loginRecent(i){const x=recentTokens[i];if(!x)return;$('#tokenInput').value=x.token;performLogin(x.token)}
function performLogin(token){token=String(token||'').trim();if(!token)return toast('توکن را وارد کنید',true);const b=$('#loginBtn');busy(b,true);setTimeout(()=>{const r=call('login',{token});busy(b,false);if(!r.ok){renderRecent();return toast(r.error||'ورود ناموفق بود',true)}showLogged(r,token);renderRecent()},20)}
$('#loginForm').addEventListener('submit',e=>{e.preventDefault();performLogin($('#tokenInput').value)});
function showLogged(r,token){state={role:r.role,data:r,token};$('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');$('#profileRole').textContent=r.role==='admin'?'مدیر':'کاربر';$('#profileName').textContent=r.role==='admin'?(r.profile?.account?.name||'مدیر'):(r.user?.name||r.user?.account?.name||r.user?.username||'کاربر');if(r.role==='admin')renderAdmin(r.subscribers||[]);else renderUser(r)}
function logout(){call('logout');state={role:null,data:null,token:null};$('#appView').classList.add('hidden');$('#loginView').classList.remove('hidden');$('#tokenInput').value='';content.innerHTML='';renderRecent()}
function refreshCurrent(){const b=$('#refreshBtn');busy(b,true);setTimeout(()=>{let r;if(state.role==='admin'){r=call('adminSubscribers');if(r.ok){renderAdmin(r.data||[]);toast('لیست بروزرسانی شد')}else toast(r.error,true)}else{r=call('overview');if(r.ok){r.role='user';r.deviceId=state.data?.deviceId;state.data=r;renderUser(r);toast('اشتراک‌ها بروزرسانی شدند')}else toast(r.error,true)}busy(b,false)},20)}
function subscriptions(a){return a?.userSubscriptions||a?.subscriptions||a?.user_subscriptions||[]}
function agentType(a){return String(a?.type||a?.agentType||a?.key||a?.name||'SERVICE').toUpperCase()}
function subId(s){return Number(s?.id||s?.subscriptionId||0)}
function acct(s){return s?.account?.name||s?.name||`اشتراک ${fa(subId(s))}`}
function diagHtml(d){if(!d?.steps)return'';return d.steps.map(x=>`<div class="diagline ${x.ok?'good':'bad'}"><span>${x.ok?'✓':'✕'}</span><span>${esc(x.detail||x.stage)}</span></div>`).join('')}
function renderUser(r){const agents=Array.isArray(r.agents)?r.agents:[];const notes=Array.isArray(r.notifications)?r.notifications:[];const count=agents.reduce((n,a)=>n+subscriptions(a).length,0);content.innerHTML=`<div class="summary"><div class="stat"><span class="muted">اشتراک‌ها</span><b>${fa(count)}</b></div><div class="stat"><span class="muted">سرویس‌ها</span><b>${fa(agents.length)}</b></div></div>${!r.subscriptionLoadOk&&r.subscriptionError?`<div class="card"><div class="notice"><b>دریافت اشتراک‌ها کامل نشد</b><p>${esc(r.subscriptionError)}</p></div></div>`:''}${notes.length?`<div class="card"><div class="sectionHead"><h2>اعلان‌ها</h2></div>${notes.map(n=>`<div class="notice"><b>${esc(n.title||'اعلان')}</b><p>${esc(n.message||n.text||'')}</p></div>`).join('')}</div>`:''}<div class="card"><div class="sectionHead"><h2>اشتراک‌های شما</h2></div><div class="services">${agents.length?agents.map(serviceHtml).join(''):'<div class="empty">اشتراکی پیدا نشد. دکمه بروزرسانی را بزنید.</div>'}</div></div>`}
function serviceHtml(a){const type=agentType(a),subs=subscriptions(a);return `<div class="service"><div class="serviceHead"><div class="serviceName">${esc(a.title||a.name||type)}</div><span class="badge">${esc(type)}</span></div>${subs.length?subs.map(s=>`<div class="subscription" id="sub-${subId(s)}"><div class="subTop"><div><div class="subName">${esc(acct(s))}</div><div class="subMeta">شناسه ${fa(subId(s))} • انقضا ${pdate(s.expiresAt||s.expirationDate)}</div></div></div><div class="actions"><button class="btn primary small" onclick="activate(${subId(s)},this)">فعال‌سازی و ورود</button></div><div class="diag hidden" data-diag></div></div>`).join(''):'<div class="empty">اشتراکی برای این سرویس ثبت نشده است.</div>'}</div>`}
function activate(id,btn){busy(btn,true);setTimeout(()=>{const r=call('activate',{subscriptionId:id});busy(btn,false);const box=document.querySelector(`#sub-${id} [data-diag]`);if(box&&r.diagnostic){box.classList.remove('hidden');box.innerHTML=diagHtml(r.diagnostic)}if(!r.ok)return toast(r.error||'فعال‌سازی ناموفق بود',true);toast('حساب فعال شد')},20)}
function renderAdmin(rows){rows=Array.isArray(rows)?rows:[];content.innerHTML=`<div class="card"><div class="sectionHead"><h2>کاربران</h2><button class="btn green small" onclick="createUser()">کاربر جدید</button></div><input class="search" id="search" placeholder="جستجو" oninput="filterUsers()"><div id="users">${rows.length?rows.map(userHtml).join(''):'<div class="empty">کاربری یافت نشد.</div>'}</div></div>`}
function userHtml(u){const id=Number(u.subscriptionId||u.id||0);return `<div class="userRow" data-user data-search="${esc((u.name||'')+' '+id)}"><div class="userHead"><div><div class="subName">${esc(u.name||'کاربر')}</div><div class="subMeta">شناسه ${fa(id)} • انقضا ${pdate(u.expiresAt)}</div></div><span class="badge">${esc(u.agentType||'USER')}</span></div><div class="tokenbox hidden" id="token-${id}"></div><div class="actions"><button class="btn ghost small" onclick="revealToken(${id},this)">نمایش توکن</button><button class="btn primary small" onclick="adminActivate(${id},this)">فعال‌سازی</button><button class="btn ghost small" onclick="editExpiry(${id})">تغییر انقضا</button><button class="btn red small" onclick="deleteUser(${id})">حذف</button></div></div>`}
function filterUsers(){const q=$('#search').value.trim().toLowerCase();document.querySelectorAll('[data-user]').forEach(x=>x.style.display=x.dataset.search.toLowerCase().includes(q)?'block':'none')}
function revealToken(id,btn){busy(btn,true);setTimeout(()=>{const r=call('subscriberToken',{subscriberId:id});busy(btn,false);if(!r.ok)return toast(r.error,true);const b=$(`#token-${id}`);b.textContent=r.token;b.classList.remove('hidden');b.onclick=()=>{AndroidApi.copy(r.token);toast('توکن کپی شد')}},20)}
function adminActivate(id,btn,target=0){busy(btn,true);setTimeout(()=>{const r=call('adminActivate',{subscriberId:id,targetSubscriptionId:target});busy(btn,false);if(!r.ok)return toast(r.error,true);if(r.requiresSelection){openModal('انتخاب اشتراک',(r.candidates||[]).map(c=>`<button class="btn ghost choice" onclick="closeModal();adminActivate(${id},document.body,${c.subscriptionId})"><b>${esc(c.accountName||c.agentType)}</b><div class="muted">${esc(c.agentType)} • ${fa(c.subscriptionId)}</div></button>`).join(''));return}toast('حساب فعال شد')},20)}
function editExpiry(id){const v=prompt('تاریخ انقضا را وارد کنید (ISO یا مقدار مورد قبول سرور)');if(!v)return;const r=call('adminUpdate',{subscriptionId:id,expiresAt:v});if(!r.ok)return toast(r.error,true);refreshCurrent()}
function createUser(){const name=prompt('نام کاربر');if(!name)return;const r=call('adminCreate',{name});if(!r.ok)return toast(r.error,true);refreshCurrent()}
function deleteUser(id){if(!confirm('این کاربر حذف شود؟'))return;const r=call('adminDelete',{subscriptionId:id});if(!r.ok)return toast(r.error,true);refreshCurrent()}
renderRecent();
</script></body></html>
