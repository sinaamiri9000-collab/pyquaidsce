<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GPT Manager</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');
:root{--bg:#06131f;--panel:#0b2030;--panel2:#0d293c;--line:#1b4056;--text:#f3f8fb;--muted:#8fa9ba;--green:#12bc84;--blue:#2f92e9;--red:#e65b68;--shadow:0 18px 50px rgba(0,0,0,.28)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 72% -10%,#123b55 0,#071724 38%,#050e17 100%);color:var(--text);font-family:Vazirmatn,Tahoma,sans-serif}button,input,textarea{font:inherit}.wrap{max-width:920px;margin:auto;padding:18px 13px 42px}.hero{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 3px 18px}.brand{display:flex;align-items:center;gap:11px}.logo{width:50px;height:50px;border-radius:17px;background:linear-gradient(145deg,#0f3652,#071a2d);border:1px solid #25516c;position:relative;box-shadow:0 12px 30px #0006}.logo:before,.logo:after{content:"";position:absolute;border:5px solid;border-radius:16px;width:24px;height:24px;transform:rotate(45deg)}.logo:before{border-color:#52e4ff;left:7px;top:8px}.logo:after{border-color:#13d89b;right:7px;bottom:8px}.brand h1{font-size:22px;margin:0}.subtitle{color:var(--muted);font-size:12px;margin-top:3px}.ver{border:1px solid #24475f;background:#0a1d2d;border-radius:999px;padding:6px 9px;color:#a9bfd0;font-size:11px}.card{background:linear-gradient(180deg,#0d2234f5,#091927f5);border:1px solid #17364b;border-radius:22px;box-shadow:var(--shadow);padding:17px;margin-bottom:13px}.login{max-width:540px;margin:4vh auto 0}.title{font-weight:800;font-size:21px;margin-bottom:6px}.desc{color:var(--muted);font-size:13px;line-height:1.85}.field{margin-top:15px}.field label{display:block;color:#aac0cf;font-size:12px;margin-bottom:6px}.field input,.field textarea,.search{width:100%;border:1px solid #20445c;border-radius:14px;background:#071725;color:#fff;padding:13px;outline:none}.field textarea{min-height:116px;resize:vertical}.field input:focus,.field textarea:focus,.search:focus{border-color:#21a9b9;box-shadow:0 0 0 3px #21a9b922}.btn{border:0;border-radius:14px;padding:11px 14px;color:#fff;background:#17334a;font-weight:700;cursor:pointer}.btn.primary{background:linear-gradient(135deg,#14b985,#2b8de8)}.btn.green{background:linear-gradient(135deg,#0ea775,#16c58d)}.btn.red{background:#71303a}.btn.amber{background:#6b5124}.btn.ghost{background:#0a1c2b;border:1px solid #24475c}.btn.small{padding:8px 10px;border-radius:11px;font-size:12px}.btn:disabled{opacity:.55}.full{width:100%;margin-top:12px}.recentWrap{margin-top:17px;border-top:1px solid #17354a;padding-top:13px}.recentHead,.sectionHead,.topbar,.serviceHead,.subTop,.userHead,.noticeHead,.calendarHead{display:flex;align-items:center;justify-content:space-between;gap:10px}.recentHead h3,.sectionHead h2{margin:0;font-size:16px}.recentList{display:grid;gap:8px;margin-top:9px}.recent{display:flex;align-items:center;gap:9px;padding:10px;border:1px solid #18394f;background:#091b2a;border-radius:14px}.recentMain{flex:1;min-width:0;cursor:pointer}.recentLabel{font-weight:700;font-size:13px}.recentToken{direction:ltr;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#90aec1;font-family:monospace;font-size:11px;margin-top:2px}.recentTime{font-size:10px;color:#6f8798;margin-top:2px}.iconBtn{width:34px;height:34px;border-radius:11px;border:1px solid #28485d;background:#0b2030;color:#a9bfd0}.hidden{display:none!important}.topbar{margin-bottom:13px}.profile{display:flex;align-items:center;gap:9px}.avatar{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#123852,#0d2234);display:grid;place-items:center;font-size:19px}.name{font-weight:800}.muted{color:var(--muted);font-size:12px}.toolbarActions{display:flex;gap:7px}.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat{border:1px solid #18394f;background:#091b2a;border-radius:16px;padding:13px}.stat b{display:block;font-size:22px;margin-top:2px}.sectionHead{margin-bottom:10px}.services{display:grid;gap:11px}.service{border:1px solid #193b51;border-radius:18px;background:#081a29;padding:14px}.serviceName{font-size:18px;font-weight:800}.badge{border:1px solid #2b5065;border-radius:999px;padding:5px 8px;color:#9bb6c7;font-size:10px}.subscription{margin-top:10px;padding:13px;border-radius:15px;background:#0e2639;border:1px solid #1c455c}.subscription.active-sub{border-color:#1c7a60;box-shadow:0 0 0 1px #13bc8430 inset}.subName{font-weight:700}.subMeta{color:#8fa8b9;font-size:11px;margin-top:4px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.diag{margin-top:10px;border-radius:13px;background:#06141e;border:1px solid #173747;padding:9px}.diagline{display:flex;gap:7px;padding:4px 0;font-size:11px}.good{color:#43d9a8}.bad{color:#ff7b85}.notice{padding:12px;border-radius:15px;background:#10283a;border:1px solid #1d465c;margin-top:8px}.notice b{display:block;font-size:13px}.notice p{margin:6px 0 0;color:#d0dde6;font-size:12px;line-height:1.9;white-space:pre-wrap}.noticeMeta{color:#809bab;font-size:10px;margin-top:6px}.noticeTools{display:flex;gap:6px;flex-wrap:wrap}.empty{padding:24px 10px;text-align:center;color:#8ea5b5}.userRow{padding:13px;border:1px solid #193d53;border-radius:16px;background:#081a29;margin-top:9px}.tokenbox{direction:ltr;text-align:left;background:#06141e;border:1px dashed #2a5064;border-radius:11px;padding:8px;font-family:monospace;font-size:11px;color:#bde8d8;overflow:auto;margin-top:8px}.adminTabs{display:flex;gap:7px;margin-bottom:12px}.adminTabs .btn.active{background:linear-gradient(135deg,#0ea775,#2b8de8)}.modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:30}.modal.show{display:flex}.sheet{width:100%;max-height:88vh;overflow:auto;background:#0a1d2c;border-radius:24px 24px 0 0;padding:17px;border-top:1px solid #285066}.choice{width:100%;text-align:right;margin-top:8px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#102333;border:1px solid #35586c;padding:10px 14px;border-radius:13px;display:none;z-index:50;max-width:90%;box-shadow:var(--shadow)}.toast.show{display:block}.loading{opacity:.55;pointer-events:none}.calendar{margin-top:8px}.calendarHead{margin-bottom:12px}.calendarMonth{font-weight:800;font-size:16px}.calendarNav{width:38px;height:38px;border-radius:12px;border:1px solid #285066;background:#0b2132;color:#fff}.weekdays,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.weekdays div{text-align:center;color:#7893a6;font-size:11px;padding:4px}.day{aspect-ratio:1;border:1px solid transparent;border-radius:12px;background:#0a1a28;color:#dce8ef;display:grid;place-items:center;cursor:pointer;font-size:12px}.day:hover{border-color:#2c6079}.day.today{border-color:#13b989}.day.selected{background:linear-gradient(135deg,#11a777,#2b8de8);color:#fff;font-weight:800}.day.other{opacity:.25}.calendarFooter{margin-top:12px;border-top:1px solid #17384c;padding-top:11px;display:flex;justify-content:space-between;align-items:center;gap:8px}.selectedDate{color:#b8cbd6;font-size:12px}.switchRow{display:flex;align-items:center;gap:8px;margin-top:12px}.switchRow input{width:18px;height:18px}.hint{margin-top:8px;color:#728d9e;font-size:10px;line-height:1.7}@media(max-width:620px){.wrap{padding:12px 10px 28px}.card{padding:14px}.hero{padding-top:4px}.subtitle{max-width:230px}.summary{grid-template-columns:1fr 1fr}.noticeHead{align-items:flex-start}}
</style>
</head>
<body><div class="wrap">
<div class="hero"><div class="brand"><div class="logo"></div><div><h1>GPT Manager</h1><div class="subtitle">ورود سریع و مدیریت اشتراک‌ها</div></div></div><div class="ver">v1.3.0</div></div>
<div id="loginView" class="card login"><div class="title">ورود با توکن</div><div class="desc">توکن حساب را وارد کنید. بعد از ورود موفق، اشتراک‌های همان حساب نمایش داده می‌شوند.</div><form id="loginForm" autocomplete="off"><div class="field"><label>توکن</label><input id="tokenInput" type="password" autocomplete="off" spellcheck="false" placeholder="توکن را وارد کنید"></div><button class="btn primary full" id="loginBtn">ورود</button></form><div id="recentWrap" class="recentWrap hidden"><div class="recentHead"><h3>توکن‌های اخیر</h3><button class="btn ghost small" onclick="clearHistory()">پاک کردن همه</button></div><div class="recentList" id="recentList"></div></div></div>
<div id="appView" class="hidden"><div class="card topbar"><div class="profile"><div class="avatar">👤</div><div><div class="name" id="profileName">حساب</div><div class="muted" id="profileRole"></div></div></div><div class="toolbarActions"><button class="btn ghost small" id="refreshBtn" onclick="refreshCurrent()">↻ بروزرسانی</button><button class="btn ghost small" onclick="logout()">خروج</button></div></div><div id="content"></div></div>
</div><div class="modal" id="modal"><div class="sheet"><div class="sectionHead"><h2 id="modalTitle">انتخاب</h2><button class="btn ghost small" onclick="closeModal()">بستن</button></div><div id="modalBody"></div></div></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);const content=$('#content');let state={role:null,data:null,token:null,activeSubscriptionId:0,activeAgentType:'',activeTarget:''};let recentTokens=[];let adminRows=[];let adminNotices=[];let adminTab='users';let cal={jy:1405,jm:1,selected:null,subscriberId:0};
function call(action,p={}){try{return JSON.parse(AndroidApi.request(action,JSON.stringify(p)))}catch(e){return{ok:false,error:String(e)}}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function attr(s){return esc(s).replace(/`/g,'&#96;')}function fa(v){return String(v??'').replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d])}
function pdate(v,t=false){if(!v)return'—';const d=new Date(v);if(isNaN(d))return fa(v);const o={calendar:'persian',year:'numeric',month:'2-digit',day:'2-digit'};if(t){o.hour='2-digit';o.minute='2-digit';o.hour12=false}return new Intl.DateTimeFormat('fa-IR-u-ca-persian',o).format(d).replace(/،/g,'')}
function toast(t,bad=false){const x=$('#toast');x.textContent=t;x.style.borderColor=bad?'#713b47':'#35586c';x.classList.add('show');setTimeout(()=>x.classList.remove('show'),3300)}function busy(el,on){if(!el)return;el.disabled=on;el.closest('.card,.service,.userRow,.subscription')?.classList.toggle('loading',on)}
function closeModal(){$('#modal').classList.remove('show')}function openModal(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modal').classList.add('show')}
function diagHtml(d){if(!d?.steps)return'';return d.steps.map(x=>`<div class="diagline ${x.ok?'good':'bad'}"><span>${x.ok?'✓':'✕'}</span><span>${esc(x.detail||x.stage)}</span></div>`).join('')}
function maskToken(t){t=String(t||'');if(t.length<13)return'••••••';return t.slice(0,5)+'…'+t.slice(-5)}
function renderRecent(){const r=call('recentTokens');recentTokens=r.ok?(r.data||[]):[];const w=$('#recentWrap'),list=$('#recentList');if(!recentTokens.length){w.classList.add('hidden');list.innerHTML='';return}w.classList.remove('hidden');list.innerHTML=recentTokens.map((x,i)=>`<div class="recent"><div class="recentMain" onclick="loginRecent(${i})"><div class="recentLabel">${esc(x.label||((x.role==='admin')?'مدیر':'کاربر'))}</div><div class="recentToken">${esc(maskToken(x.token))}</div><div class="recentTime">آخرین ورود: ${pdate(Number(x.lastUsed||0),true)}</div></div><button class="iconBtn" onclick="forgetRecent(event,${i})">×</button></div>`).join('')}
function forgetRecent(e,i){e.stopPropagation();const x=recentTokens[i];if(!x)return;call('forgetRecentToken',{token:x.token});renderRecent()}function clearHistory(){if(!confirm('تاریخچه توکن‌ها پاک شود؟'))return;call('clearRecentTokens');renderRecent()}function loginRecent(i){const x=recentTokens[i];if(!x)return;$('#tokenInput').value=x.token;performLogin(x.token)}
$('#loginForm').addEventListener('submit',e=>{e.preventDefault();performLogin($('#tokenInput').value.trim())});function performLogin(token){if(!token)return toast('توکن را وارد کنید',true);const b=$('#loginBtn');busy(b,true);setTimeout(()=>{const r=call('login',{token});busy(b,false);if(!r.ok)return toast(r.error||'ورود ناموفق بود',true);showLogged(r,token);renderRecent()},20)}
function showLogged(r,token){const a=r.active||{};state={role:r.role,data:r,token,activeSubscriptionId:Number(a.subscriptionId||0),activeAgentType:a.agentType||'',activeTarget:a.target||''};$('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');$('#profileRole').textContent=r.role==='admin'?'مدیر':'کاربر';$('#profileName').textContent=r.role==='admin'?(r.profile?.account?.name||'مدیر'):(r.user?.name||r.user?.account?.name||r.user?.username||'کاربر');if(r.role==='admin'){adminRows=Array.isArray(r.subscribers)?r.subscribers:[];renderAdmin()}else renderUser(r)}
function logout(){call('logout');state={role:null,data:null,token:null,activeSubscriptionId:0,activeAgentType:'',activeTarget:''};adminRows=[];adminNotices=[];$('#appView').classList.add('hidden');$('#loginView').classList.remove('hidden');$('#tokenInput').value='';content.innerHTML='';renderRecent();setTimeout(renderRecent,80)}
function refreshCurrent(){const b=$('#refreshBtn');busy(b,true);setTimeout(()=>{if(state.role==='admin'){const r=call('adminSubscribers');if(r.ok){adminRows=r.data||[];if(adminTab==='notices')loadAdminNotices(false);renderAdmin();toast('اطلاعات بروزرسانی شد')}else toast(r.error,true)}else{const r=call('overview');if(r.ok){r.role='user';r.deviceId=state.data?.deviceId;r.active=r.active||{subscriptionId:state.activeSubscriptionId,agentType:state.activeAgentType,target:state.activeTarget};state.data=r;showLogged(r,state.token);toast('اشتراک‌ها بروزرسانی شدند')}else toast(r.error,true)}busy(b,false)},20)}
function subscriptions(a){return a?.userSubscriptions||a?.subscriptions||a?.user_subscriptions||[]}function agentType(a){return String(a?.type||a?.agentType||a?.key||a?.name||'SERVICE').toUpperCase()}function subId(s){return Number(s?.id||s?.subscriptionId||0)}function acct(s){return s?.account?.name||s?.name||`اشتراک ${fa(subId(s))}`}
function noticeObj(n){return (n&&typeof n==='object')?(n.notification||n.notice||n.alert||n):{}}function noticeId(n){const o=noticeObj(n);return Number(o.id||o.notificationId||o.notification_id||n?.id||0)}function noticeTitle(n){const o=noticeObj(n);return o.title||o.subject||o.name||o.notification_title||n?.title||'اعلان'}function noticeText(n){const o=noticeObj(n);const keys=['message','text','body','content','description','notificationText','notification_text','message_fa','description_fa','detail'];for(const k of keys){if(typeof o[k]==='string'&&o[k].trim())return o[k].trim()}for(const k of ['notification','notice','alert','data']){const z=o[k];if(z&&z!==o){const t=noticeText(z);if(t)return t}}return''}function noticeActive(n){const o=noticeObj(n);return o.active!==false&&o.isActive!==false&&o.enabled!==false}
function renderUser(r){const agents=Array.isArray(r.agents)?r.agents:[];const notes=Array.isArray(r.notifications)?r.notifications:[];const count=agents.reduce((n,a)=>n+subscriptions(a).length,0);content.innerHTML=`<div class="summary"><div class="stat"><span class="muted">اشتراک‌ها</span><b>${fa(count)}</b></div><div class="stat"><span class="muted">سرویس‌ها</span><b>${fa(agents.length)}</b></div></div>${!r.subscriptionLoadOk&&r.subscriptionError?`<div class="card"><div class="notice"><b>دریافت اشتراک‌ها کامل نشد</b><p>${esc(r.subscriptionError)}</p></div></div>`:''}${notes.length?`<div class="card"><div class="sectionHead"><h2>اعلان‌ها</h2><span class="badge">${fa(notes.length)}</span></div>${notes.map(n=>`<div class="notice"><b>${esc(noticeTitle(n))}</b><p>${esc(noticeText(n)||'متن این اعلان از سرور خالی برگشته است.')}</p></div>`).join('')}</div>`:''}<div class="card"><div class="sectionHead"><h2>اشتراک‌های شما</h2></div><div class="services">${agents.length?agents.map(serviceHtml).join(''):'<div class="empty">اشتراکی پیدا نشد. دکمه بروزرسانی را بزنید.</div>'}</div></div>`}
function serviceHtml(a){const type=agentType(a),subs=subscriptions(a);return `<div class="service"><div class="serviceHead"><div class="serviceName">${esc(a.title||a.name||type)}</div><span class="badge">${esc(type)}</span></div>${subs.length?subs.map(s=>{const id=subId(s),active=Number(state.activeSubscriptionId)===Number(id);return `<div class="subscription ${active?'active-sub':''}" id="sub-${id}"><div class="subTop"><div><div class="subName">${esc(acct(s))}</div><div class="subMeta">شناسه ${fa(id)} • انقضا ${pdate(s.expiresAt||s.expirationDate)}</div></div>${active?'<span class="badge" style="color:#43d9a8;border-color:#21745d">فعال در مرورگر</span>':''}</div><div class="actions">${active?`<button class="btn green small" onclick="openActiveService(this)">ورود به سرویس</button><button class="btn ghost small" onclick="deactivateCurrent(this)">غیرفعال‌سازی</button>`:`<button class="btn primary small" onclick="activate(${id},this)">فعال‌سازی و ورود</button>`}</div><div class="diag hidden" data-diag></div></div>`}).join(''):'<div class="empty">اشتراکی برای این سرویس ثبت نشده است.</div>'}</div>`}
function activate(id,btn){busy(btn,true);setTimeout(()=>{const r=call('activate',{subscriptionId:id});busy(btn,false);const box=document.querySelector(`#sub-${id} [data-diag]`);if(box&&r.diagnostic){box.classList.remove('hidden');box.innerHTML=diagHtml(r.diagnostic)}if(!r.ok)return toast(r.error||'فعال‌سازی ناموفق بود',true);state.activeSubscriptionId=Number(id);state.activeAgentType=r.agentType||'';state.activeTarget=r.target||'';if(state.data)renderUser(state.data);toast('حساب فعال شد')},20)}
function openActiveService(btn){busy(btn,true);const r=call('openActiveService');busy(btn,false);if(!r.ok)toast(r.error||'ورود به سرویس انجام نشد',true)}function deactivateCurrent(btn){busy(btn,true);const r=call('deactivate');busy(btn,false);if(!r.ok)return toast(r.error||'غیرفعال‌سازی انجام نشد',true);state.activeSubscriptionId=0;state.activeAgentType='';state.activeTarget='';if(state.data)renderUser(state.data);toast('حساب غیرفعال شد')}
function setAdminTab(tab){adminTab=tab;if(tab==='notices')loadAdminNotices(false);renderAdmin()}function renderAdmin(){content.innerHTML=`<div class="adminTabs"><button class="btn small ${adminTab==='users'?'active':''}" onclick="setAdminTab('users')">کاربران</button><button class="btn small ${adminTab==='notices'?'active':''}" onclick="setAdminTab('notices')">اعلان‌ها</button></div>${adminTab==='users'?renderAdminUsers():renderAdminNotices()}`}
function renderAdminUsers(){return `<div class="card"><div class="sectionHead"><h2>کاربران</h2><button class="btn green small" onclick="createUser()">کاربر جدید</button></div><input class="search" id="search" placeholder="جستجو" oninput="filterUsers()"><div id="users">${adminRows.length?adminRows.map(userHtml).join(''):'<div class="empty">کاربری یافت نشد.</div>'}</div></div>`}
function userHtml(u){const id=Number(u.subscriptionId||u.id||0);return `<div class="userRow" data-user data-search="${attr((u.name||'')+' '+id)}"><div class="userHead"><div><div class="subName">${esc(u.name||'کاربر')}</div><div class="subMeta">شناسه ${fa(id)} • انقضا ${pdate(u.expiresAt)}</div></div><span class="badge">${esc(u.agentType||'USER')}</span></div><div class="tokenbox hidden" id="token-${id}"></div><div class="actions"><button class="btn ghost small" onclick="revealToken(${id},this)">نمایش توکن</button><button class="btn primary small" onclick="adminActivate(${id},this)">فعال‌سازی</button><button class="btn ghost small" onclick="openExpiryCalendar(${id})">تغییر انقضا</button><button class="btn red small" onclick="deleteUser(${id})">حذف</button></div></div>`}
function filterUsers(){const q=$('#search').value.trim().toLowerCase();document.querySelectorAll('[data-user]').forEach(x=>x.style.display=(x.dataset.search||'').toLowerCase().includes(q)?'':'none')}function revealToken(id,btn){const box=$(`#token-${id}`);if(!box.classList.contains('hidden')){box.classList.add('hidden');return}busy(btn,true);const r=call('subscriberToken',{subscriberId:id});busy(btn,false);if(!r.ok)return toast(r.error,true);box.textContent=r.token;box.classList.remove('hidden');box.onclick=()=>{AndroidApi.copy(r.token);toast('توکن کپی شد')}}
function adminActivate(id,btn,target=0){busy(btn,true);setTimeout(()=>{const r=call('adminActivate',{subscriberId:id,targetSubscriptionId:target});busy(btn,false);if(!r.ok)return toast(r.error,true);if(r.requiresSelection){openModal('انتخاب اشتراک',(r.candidates||[]).map(c=>`<button class="btn ghost choice" onclick="closeModal();adminActivate(${id},document.body,${c.subscriptionId})"><b>${esc(c.accountName||c.agentType)}</b><div class="muted">${esc(c.agentType)} • ${fa(c.subscriptionId)}</div></button>`).join(''));return}toast('حساب فعال شد')},20)}
function createUser(){openModal('کاربر جدید',`<div class="field"><label>نام</label><input id="newUserName"></div><button class="btn green full" onclick="submitNewUser()">ثبت</button>`)}function submitNewUser(){const name=$('#newUserName').value.trim();if(!name)return toast('نام را وارد کنید',true);const r=call('adminCreate',{name});if(!r.ok)return toast(r.error,true);closeModal();refreshCurrent()}function deleteUser(id){if(!confirm('این کاربر حذف شود؟'))return;const r=call('adminDelete',{subscriptionId:id});if(!r.ok)return toast(r.error,true);refreshCurrent()}
function loadAdminNotices(showToast=true){const r=call('adminNotifications');if(r.ok){adminNotices=Array.isArray(r.data)?r.data:[];if(showToast)toast('اعلان‌ها بروزرسانی شدند')}else{adminNotices=[];if(showToast)toast(r.error||'دریافت اعلان‌ها ناموفق بود',true)}return r}function renderAdminNotices(){return `<div class="card"><div class="sectionHead"><h2>مدیریت اعلان‌ها</h2><div class="toolbarActions"><button class="btn ghost small" onclick="loadAdminNotices();renderAdmin()">↻</button><button class="btn green small" onclick="openNoticeEditor(-1)">اعلان جدید</button></div></div>${adminNotices.length?adminNotices.map((n,i)=>noticeAdminHtml(n,i)).join(''):'<div class="empty">اعلانی از سرور دریافت نشد.</div>'}</div>`}
function noticeAdminHtml(n,i){const id=noticeId(n);return `<div class="notice"><div class="noticeHead"><div><b>${esc(noticeTitle(n))}</b><div class="noticeMeta">${noticeActive(n)?'فعال':'غیرفعال'}${id?' • #'+fa(id):''}</div></div><div class="noticeTools"><button class="btn ghost small" onclick="openNoticeEditor(${i})">ویرایش</button>${id?`<button class="btn red small" onclick="deleteNotice(${id})">حذف</button>`:''}</div></div><p>${esc(noticeText(n)||'بدون متن')}</p></div>`}function openNoticeEditor(index){const n=index>=0?adminNotices[index]:{};const id=noticeId(n);openModal(index>=0?'ویرایش اعلان':'اعلان جدید',`<div class="field"><label>عنوان</label><input id="noticeTitle" value="${attr(index>=0?noticeTitle(n):'')}"></div><div class="field"><label>متن اعلان</label><textarea id="noticeMessage" placeholder="متن اعلان">${esc(index>=0?noticeText(n):'')}</textarea></div><label class="switchRow"><input id="noticeActive" type="checkbox" ${index<0||noticeActive(n)?'checked':''}><span>اعلان فعال باشد</span></label><button class="btn green full" onclick="saveNotice(${id||0})">${index>=0?'ذخیره تغییرات':'ثبت اعلان'}</button>`)}function saveNotice(id){const title=$('#noticeTitle').value.trim(),message=$('#noticeMessage').value.trim(),active=$('#noticeActive').checked;if(!title||!message)return toast('عنوان و متن اعلان لازم است',true);const action=id?'adminNotificationUpdate':'adminNotificationCreate';const r=call(action,{notificationId:id,title,message,active});if(!r.ok)return toast(r.error||'ثبت اعلان ناموفق بود',true);closeModal();loadAdminNotices(false);renderAdmin();toast(id?'اعلان ویرایش شد':'اعلان ثبت شد')}function deleteNotice(id){if(!confirm('این اعلان حذف شود؟'))return;const r=call('adminNotificationDelete',{notificationId:id});if(!r.ok)return toast(r.error||'حذف اعلان ناموفق بود',true);loadAdminNotices(false);renderAdmin();toast('اعلان حذف شد')}
const jMonths=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];function div(a,b){return~~(a/b)}function mod(a,b){return a-~~(a/b)*b}function jalCal(jy){const breaks=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];let bl=breaks.length,gy=jy+621,leapJ=-14,jp=breaks[0],jm,jump,leap,n,i;if(jy<jp||jy>=breaks[bl-1])throw Error('Invalid Jalaali year');for(i=1;i<bl;i++){jm=breaks[i];jump=jm-jp;if(jy<jm)break;leapJ+=div(jump,33)*8+div(mod(jump,33),4);jp=jm}n=jy-jp;leapJ+=div(n,33)*8+div(mod(n,33)+3,4);if(mod(jump,33)===4&&jump-n===4)leapJ++;const leapG=div(gy,4)-div((div(gy,100)+1)*3,4)-150;const march=20+leapJ-leapG;if(jump-n<6)n=n-jump+div(jump+4,33)*33;leap=mod(mod(n+1,33)-1,4);if(leap===-1)leap=4;return{leap,gy,march}}function g2d(gy,gm,gd){let d=div((gy+div(gm-8,6)+100100)*1461,4)+div(153*mod(gm+9,12)+2,5)+gd-34840408;d=d-div(div(gy+100100+div(gm-8,6),100)*3,4)+752;return d}function d2g(jdn){let j=4*jdn+139361631;j=j+div(div(4*jdn+183187720,146097)*3,4)*4-3908;const i=div(mod(j,1461),4)*5+308;const gd=div(mod(i,153),5)+1,gm=mod(div(i,153),12)+1,gy=div(j,1461)-100100+div(8-gm,6);return{gy,gm,gd}}function j2d(jy,jm,jd){const r=jalCal(jy);return g2d(r.gy,3,r.march)+(jm-1)*31-div(jm,7)*(jm-7)+jd-1}function d2j(jdn){const g=d2g(jdn),jy=g.gy-621,r=jalCal(jy),jdn1f=g2d(g.gy,3,r.march);let k=jdn-jdn1f;if(k>=0){if(k<=185)return{jy,jm:1+div(k,31),jd:mod(k,31)+1};k-=186}else{let j=jy-1,k2=k+179;if(r.leap===1)k2++;return{jy:j,jm:7+div(k2,30),jd:mod(k2,30)+1}}return{jy,jm:7+div(k,30),jd:mod(k,30)+1}}function toJalaali(gy,gm,gd){return d2j(g2d(gy,gm,gd))}function toGregorian(jy,jm,jd){return d2g(j2d(jy,jm,jd))}function monthLen(jy,jm){if(jm<=6)return31;if(jm<=11)return30;return jalCal(jy).leap===0?30:29}function openExpiryCalendar(id){const u=adminRows.find(x=>Number(x.subscriptionId||x.id||0)===Number(id));let d=u?.expiresAt?new Date(u.expiresAt):new Date();if(isNaN(d))d=new Date();const j=toJalaali(d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate());cal={jy:j.jy,jm:j.jm,selected:{jy:j.jy,jm:j.jm,jd:j.jd},subscriberId:id};openModal('انتخاب تاریخ انقضا','<div id="calendarBox"></div>');renderCalendar()}function navMonth(delta){cal.jm+=delta;if(cal.jm<1){cal.jm=12;cal.jy--}if(cal.jm>12){cal.jm=1;cal.jy++}renderCalendar()}function pickDay(d){cal.selected={jy:cal.jy,jm:cal.jm,jd:d};renderCalendar()}function renderCalendar(){const first=toGregorian(cal.jy,cal.jm,1),weekday=(new Date(Date.UTC(first.gy,first.gm-1,first.gd)).getUTCDay()+1)%7,days=monthLen(cal.jy,cal.jm),todayD=new Date(),today=toJalaali(todayD.getFullYear(),todayD.getMonth()+1,todayD.getDate());let cells='';for(let i=0;i<weekday;i++)cells+='<span></span>';for(let d=1;d<=days;d++){const sel=cal.selected&&cal.selected.jy===cal.jy&&cal.selected.jm===cal.jm&&cal.selected.jd===d,now=today.jy===cal.jy&&today.jm===cal.jm&&today.jd===d;cells+=`<button class="day ${sel?'selected':''} ${now?'today':''}" onclick="pickDay(${d})">${fa(d)}</button>`}const s=cal.selected;$('#calendarBox').innerHTML=`<div class="calendar"><div class="calendarHead"><button class="calendarNav" onclick="navMonth(-1)">›</button><div class="calendarMonth">${jMonths[cal.jm-1]} ${fa(cal.jy)}</div><button class="calendarNav" onclick="navMonth(1)">‹</button></div><div class="weekdays"><div>ش</div><div>ی</div><div>د</div><div>س</div><div>چ</div><div>پ</div><div>ج</div></div><div class="days">${cells}</div><div class="calendarFooter"><div class="selectedDate">${s?`${fa(s.jy)}/${fa(String(s.jm).padStart(2,'0'))}/${fa(String(s.jd).padStart(2,'0'))}`:'یک روز انتخاب کنید'}</div><button class="btn green small" onclick="saveExpiryDate()" ${s?'':'disabled'}>ثبت تاریخ</button></div></div>`}function saveExpiryDate(){if(!cal.selected)return;const g=toGregorian(cal.selected.jy,cal.selected.jm,cal.selected.jd);const iso=`${g.gy}-${String(g.gm).padStart(2,'0')}-${String(g.gd).padStart(2,'0')}T23:59:59.000Z`;const r=call('adminUpdate',{subscriptionId:cal.subscriberId,expiresAt:iso});if(!r.ok)return toast(r.error||'تغییر تاریخ ناموفق بود',true);closeModal();const s=call('adminSubscribers');if(s.ok)adminRows=s.data||[];renderAdmin();toast('تاریخ انقضا بروزرسانی شد')}
function autoResume(){const r=call('resume');if(r&&r.ok&&r.role){showLogged(r,r.token||null);return true}return false}if(!autoResume())renderRecent();
