<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1224" viewBox="0 0 1536 1224" role="img" aria-labelledby="title desc">
<title id="title">Shared computational core and estimation workflow</title>
<desc id="desc">A shared Python core serves Stata, Python, and R. Optional censoring and expenditure-endogeneity stages feed demand-system estimation, followed by predictions, elasticities, and bootstrap inference.</desc>
