[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyquaidsce"
version = "1.0.1"
description = "Censored QUAIDS estimation in Python with Stata-compatibility and validation tooling"
authors = [{name = "Sina Amiri"}]
maintainers = [{name = "Sina Amiri"}]
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
keywords = [
    "QUAIDS",
    "AIDS",
    "demand-system",
    "econometrics",
    "censoring",
    "Shonkwiler-Yen",
    "Stata",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "pandas>=1.4",
]
[project.urls]
Homepage = "https://github.com/sinaamiri9000-collab/pyquaidsce"
Repository = "https://github.com/sinaamiri9000-collab/pyquaidsce"
Issues = "https://github.com/sinaamiri9000-collab/pyquaidsce/issues"
Changelog = "https://github.com/sinaamiri9000-collab/pyquaidsce/blob/main/CHANGELOG.md"
"Original Stata package" = "https://github.com/juancaros/quaidsce"
"Original software record" = "https://ideas.repec.org/c/boc/bocode/s459029.html"
"Method paper" = "https://ideas.repec.org/p/boc/bocoec/1045.html"

[tool.setuptools.packages.find]
where = ["src"]
